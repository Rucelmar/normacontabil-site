name: Deploy

# Push na main publica o site em produção (Cloudflare Pages, conta da Norma).
# Inclui os posts gravados pelo painel adm. Requer os secrets do repositório:
# CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (ambos da conta Cloudflare da Norma).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pages:
    name: Pages (www.normacontabil.com)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name normacontabil-site --branch main
