# Cloudflare Pages — site Norma Contábil (Astro + adapter Cloudflare)
# Conta Cloudflare da Norma. Cada push na main roda o GitHub Actions
# (.github/workflows/deploy.yml): astro build + wrangler pages deploy.
name = "normacontabil-site"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# KV usado para rate limiting dos endpoints /api/contato e /api/newsletter.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "d8135e65650c46808e7d06fcb7a8afa7"
